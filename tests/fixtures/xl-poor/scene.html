<h4>Our 3D world</h4>
<canvas id="c"></canvas>
<p>Amazing technology.</p>
<script>
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl');
  function sh(t, s) { var x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); return x; }
  var pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 p;uniform float a;void main(){float s=sin(a),k=cos(a);gl_Position=vec4(p.x*k-p.y*s,p.x*s+p.y*k,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, 'precision mediump float;void main(){gl_FragColor=vec4(1.,.3,.5,1.);}'));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, .7, -.6, -.5, .6, -.5]), gl.STATIC_DRAW);
  var P = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(P); gl.vertexAttribPointer(P, 2, gl.FLOAT, false, 0, 0);
  var uA = gl.getUniformLocation(pr, 'a'); var angle = 0;
  (function loop() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; gl.viewport(0, 0, canvas.width, canvas.height); angle += 0.03; gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform1f(uA, angle); gl.drawArrays(gl.TRIANGLES, 0, 3); requestAnimationFrame(loop); })();
</script>
