<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen — Contact</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <a class="brand" href="index.html">Lumen</a>
    <nav aria-label="Primary"><ul><li><a href="index.html">Home</a></li><li><a href="form.html" aria-current="page">Contact</a></li><li><a href="scene.html">3D scene</a></li></ul></nav>
    <button type="button" class="btn secondary motion-toggle" aria-pressed="false">Pause animations</button>
  </header>
  <main id="main">
    <h1>Contact us</h1>
    <p>We answer within two working days. Fields marked * are required.</p>
    <div id="form-errors" role="alert"></div>
    <form id="contact" novalidate>
      <p><label for="name">Name *</label><input id="name" name="name" required autocomplete="name" aria-describedby="name-error"><span id="name-error" class="error"></span></p>
      <p><label for="email">Email *</label><input id="email" name="email" type="email" required autocomplete="email" aria-describedby="email-error"><span id="email-error" class="error"></span></p>
      <p><label for="message">Message</label><textarea id="message" name="message" rows="3"></textarea></p>
      <button class="btn" type="submit">Send message</button>
    </form>
    <p id="form-status" role="status"></p>
  </main>
  <footer><a href="index.html">Lumen home</a></footer>
  <script src="app.js"></script>
</body>
</html>
